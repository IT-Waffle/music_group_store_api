services:
  db:
    image: postgres:16-alpine
    container_name: music_band_store_db
    restart: always
    env_file: 
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Checks if DataBase is running and responding
      test: ["CMD-SHELL", "pg_isready -U postgres -d music_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:8-alpine
    container_name: music_band_store_cache
    restart: always
    healthcheck:
      # Checks if Redis is running and responding to PING command
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: music_band_store_api
    restart: always
    ports:
      # Localhost only: the public entry point is Nginx/Cloudflare. Docker
      # bypasses ufw for published ports, so 0.0.0.0 would expose the API
      # (and /docs) directly on the server IP.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy  # Waiting for PostgreSQL
      cache:
        condition: service_healthy  # Waiting for Redis
    volumes:
      - media_data:/app/uploads
    env_file:
      - .env
    healthcheck:
      # Checks if the FastAPI application is running and healthy
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  media_data:
